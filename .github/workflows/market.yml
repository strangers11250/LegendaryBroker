name: Market platform CI and deployment
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-test.lock
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: web
      - name: Verify built app over HTTP
        env:
          PYTHONPATH: src
          BROKER_DB_PATH: /tmp/market-ci.sqlite3
        run: |
          set -euo pipefail
          python -m uvicorn legendary_broker.api:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done
          python deploy/verify_http.py --allow-empty
      - run: python deploy/build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-release
          path: dist/market-release.tar.gz
          retention-days: 14
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MARKET_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: market-release
      - name: Install SSH deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.MARKET_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MARKET_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/market_deploy
          chmod 600 ~/.ssh/market_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Transfer verified artifact and deploy
        env:
          DEPLOY_HOST: ${{ vars.MARKET_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.MARKET_DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          scp -i ~/.ssh/market_deploy -o BatchMode=yes market-release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/market-$RELEASE_ID.tar.gz"
          ssh -i ~/.ssh/market_deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; release=/opt/legendary-market/releases/$RELEASE_ID; sudo mkdir -p \"\$release\"; sudo tar -xzf /tmp/market-$RELEASE_ID.tar.gz -C \"\$release\"; sudo bash \"\$release/deploy/install-release.sh\" \"\$release\""
      - name: Remove temporary deployment identity
        if: always()
        run: rm -f ~/.ssh/market_deploy
