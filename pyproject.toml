[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legendary-broker"
version = "0.1.0"
description = "A research-first, risk-controlled quantitative trading system"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "streamlit>=1.35",
  "pyarrow>=15",
  "alpaca-py>=0.28",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
legendary-broker = "legendary_broker.cli:main"
legendary-validate-bars = "legendary_broker.data:main"
legendary-model = "legendary_broker.models:main"
legendary-ingest = "legendary_broker.ingestion:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
